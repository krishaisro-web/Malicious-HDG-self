# Malicious-HDG Configuration: HP Thin Client Profile (ISRO Environment)
# ==============================================================================
# MANUAL / CHATGPT CALIBRATION GUIDE:
# 1. Run diagnostic on your ISRO PC terminal:
#      bash tools/check_system.sh   (or: python3 tools/probe_hardware.py)
# 2. If your RAM is ~4 GB:
#      graph.max_domains: 15000 | parsing.max_per_class: 7500 | batch_size: 128 | hidden_dim: 16
# 3. If your RAM is ~8 GB (DEFAULT BELOW):
#      graph.max_domains: 30000 | parsing.max_per_class: 15000 | batch_size: 256 | hidden_dim: 32
# 4. If your RAM is >= 16 GB:
#      graph.max_domains: 50000 | parsing.max_per_class: 25000 | batch_size: 512 | hidden_dim: 64
# 5. Keep 'num_threads: 2' on thin clients to prevent fanless thermal downclocking.
# ==============================================================================

randomness:
  seed: 42
  evaluation_seeds: [42, 1337, 2024] # 3 seeds for robust evaluation while keeping runtime manageable on low-power CPU

paths:
  raw_data_dir: "data/raw/zenodo"
  processed_data_dir: "data/processed/real"
  results_dir: "results/real"
  checkpoints_dir: "artifacts/checkpoints/real"
  fixture_raw_dir: "data/fixture/zenodo"
  fixture_processed_dir: "data/processed/fixture"
  fixture_results_dir: "results/fixture"
  fixture_checkpoints_dir: "artifacts/checkpoints/fixture"

hardware:
  profile: "hp_thin_client"
  num_threads: 2 # 2 threads prevents thermal throttling on passive heatsinks and avoids OS starvation
  memory_limit_gb: 8.0 # Soft guide for in-memory graph allocation

profiling:
  min_distinct_months_for_time_split: 4
  top_sources_count: 20
  top_families_count: 30
  max_profile_markdown_lines: 200

parsing:
  normalize_to_e2LD: true
  include_has_subdomain: false
  benign_ratio: 2.0
  max_per_class: 15000 # Capping records per source class prevents RAM exhaustion during stream parsing
  asn_candidate_keys: ["asn", "autonomous_system_number", "number"]
  registrar_candidate_keys: ["name", "handle", "organization"]

graph:
  hub_degree: 300 # Lower hub degree to prune super-connected hub nodes that balloon RAM
  hub_percentile: 99.5
  max_domains: 30000 # 30,000 domains easily fits in 4GB-8GB RAM (< 1.5 GB memory footprint)
  node_types:
    - domain
    - ip
    - nameserver
    - registrar
    - asn
    - certificate
  edge_types:
    - ["domain", "resolves_to", "ip"]
    - ["nameserver", "ns_ip", "ip"]
    - ["domain", "uses_ns", "nameserver"]
    - ["domain", "registered_by", "registrar"]
    - ["ip", "belongs_to_asn", "asn"]
    - ["domain", "uses_cert", "certificate"]
  features:
    use_lexical: true
    lexical_stats:
      - length
      - entropy
      - digit_ratio
      - vowel_ratio
      - longest_consonant_run
  degree_mode: "transductive"
  cert_key_mode: "cn"
  include_bgp_prefix: false

temporal:
  min_distinct_months: 3
  min_per_class_per_window: 200

group:
  joint_grouping: false
  hub_cutoff: 300
  max_prevalence_discrepancy: 0.05

model:
  sage:
    hidden_dim: 32 # 32 dimensions saves 50% activation RAM compared to 64
    out_dim: 16
    num_layers: 2
    dropout: 0.2
  attn:
    hidden_dim: 32
    out_dim: 16
    num_heads: 2
    num_layers: 2
    dropout: 0.2
  sage_guard:
    hidden_dim: 32
    out_dim: 16
    num_layers: 2
    dropout: 0.2
    prune_threshold: 0.1
  training:
    epochs: 50 # 50 epochs ensures fast convergence while respecting thin client CPU thermal limits
    patience: 10
    lr: 0.005
    lr_grid: [0.003, 0.005] # Compact grid reduces search time by 33%
    weight_decay: 0.0001
    batch_size: 256 # 256 batch size drastically lowers memory spikes during forward/backward passes
    use_class_weights: false
    scheduler: "plateau"

baselines:
  tfidf:
    analyzer: "char"
    ngram_range: [2, 5]
    min_df: 5
    max_features: 2500 # 2,500 features saves sparse matrix memory
    C: 1.0
  xgboost:
    n_estimators: 50 # 50 trees prevents CPU over-utilization
    max_depth: 4 # Shallower trees prevent exponential memory growth
    learning_rate: 0.1
    subsample: 0.8
    eval_metric: "logloss"

attack:
  rho_list: [1.0, 0.5]
  budgets: [1, 2, 5, 10]
  surfaces: ["ip", "nameserver", "registrar", "certificate"]
  manipulate_features: true

streaming:
  strategies: ["retrain_from_scratch", "naive_finetune", "replay"]
  replay_reservoir_size: 500

latency:
  warmup: 10
  num_queries: 200
  batch_sizes: [1, 32]

evaluation:
  bootstrap_samples: 200 # 200 samples produces tight CIs without hours of CPU looping
  ci_level: 0.95
  target_fprs: [0.01, 0.001]
  min_fp_warning_threshold: 10
  prevalence_pi_list: [0.01, 0.001]

preflight:
  sample_ratio: 0.10
