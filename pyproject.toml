[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "malicious-hdg"
version = "2.0.0"
description = "Heterogeneous Graph Neural Network for Malicious Domain Detection on Zenodo DomainRadar v2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Malicious-HDG Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",
    "pyarrow>=14.0.0",
    "tldextract>=5.0.0",
    "ijson>=3.2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::FutureWarning:torch.jit.*",
    "ignore::DeprecationWarning:torch_geometric.*",
]
